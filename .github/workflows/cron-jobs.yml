name: MiSender Continuous Crons (Dispatch, Unibox Sync & Warmup)

on:
  schedule:
    # Runs every 15 minutes for continuous outbound dispatch & IMAP Unibox sync
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-crons:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Campaign Dispatch
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://instantly-app-ten.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set in GitHub Actions."
            exit 1
          fi
          curl -fsS -X POST "$APP_URL/api/cron/dispatch" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"

      - name: Trigger Unibox IMAP Sync & Deliverability Guard
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://instantly-app-ten.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "$APP_URL/api/cron/unibox-sync" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"

      - name: Trigger Warmup Round (Every 2 Hours)
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event.schedule != '' && (fromJSON(format('"{0}"', github.event.schedule)) != '')) }}
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://instantly-app-ten.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          if [ "$((10#$HOUR % 2))" -eq 0 ] && [ "$((10#$MINUTE))" -lt 15 ]; then
            curl -fsS -X POST "$APP_URL/api/cron/warmup" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json"
          else
            echo "Skipping warmup outside 2-hour window."
          fi
